name: Build & Run

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Compile and run every program
        run: |
          fail=0
          while IFS= read -r file; do
            name=$(basename "$file" .java)
            out="out/$(dirname "$file")/$name"
            mkdir -p "$out"
            echo "::group::$file"
            if javac -Xlint:all -d "$out" "$file" && java -cp "$out" "$name"; then
              echo "OK"
            else
              echo "::error file=$file::failed to compile or run"
              fail=1
            fi
            echo "::endgroup::"
          done < <(find . -name "*.java" -not -path "./out/*" | sort)
          exit $fail
